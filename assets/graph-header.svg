<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Ko Yamasaki — Graph Algorithms and Intelligent Systems</title>
  <desc id="desc">A minimal two-terminal series-parallel graph illustration beside Ko Yamasaki's name and research focus.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#102b46"/>
      <stop offset="1" stop-color="#123a50"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="260" rx="18" fill="url(#background)"/>
  <circle cx="852" cy="-20" r="180" fill="#38bdf8" opacity="0.045"/>
  <circle cx="72" cy="280" r="190" fill="#5eead4" opacity="0.04"/>

  <g fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.72">
    <path d="M76 130 L140 77 L213 77 L278 130"/>
    <path d="M76 130 L140 183 L213 183 L278 130"/>
    <path d="M140 77 L176 130 L213 77" opacity="0.45"/>
    <path d="M140 183 L176 130 L213 183" opacity="0.45"/>
  </g>
  <g fill="#0b2035" stroke="#67e8f9" stroke-width="2">
    <circle cx="76" cy="130" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="140" cy="77" r="6"/>
    <circle cx="140" cy="183" r="6"/>
    <circle cx="176" cy="130" r="6"/>
    <circle cx="213" cy="77" r="6"/>
    <circle cx="213" cy="183" r="6"/>
    <circle cx="278" cy="130" r="8" fill="#5eead4" filter="url(#glow)"/>
  </g>
  <g fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" opacity="0.68">
    <text x="64" y="154">s</text>
    <text x="270" y="154">t</text>
  </g>

  <line x1="332" y1="54" x2="332" y2="206" stroke="#7dd3fc" stroke-width="1" opacity="0.22"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="382" y="101" fill="#f8fafc" font-size="43" font-weight="650" letter-spacing="-1">Ko Yamasaki</text>
    <text x="384" y="139" fill="#7dd3fc" font-size="15.5" font-weight="600" letter-spacing="1.25">GRAPH ALGORITHMS · INTELLIGENT SYSTEMS</text>
    <text x="384" y="178" fill="#cbd5e1" font-size="16">Algorithms for structure, learning, and networks.</text>
  </g>
</svg>
